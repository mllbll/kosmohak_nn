services:
  api:
    build: .
    image: kosmohak-nn:latest
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      PYTHON_BIN: python3
      RUNNER_SCRIPT: python/runner.py
      CORS_ORIGINS: "*"
    restart: unless-stopped

  web:
    build: ./frontend
    image: kosmohak-nn-web:latest
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
