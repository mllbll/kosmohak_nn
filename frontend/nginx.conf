server {
 listen 80;
 server_name _;
 client_max_body_size 12m;
 root /usr/share/nginx/html;
 index index.html;
 location /api/ { proxy_pass http://api:8080; proxy_read_timeout 310s; proxy_send_timeout 310s; }
 location /health { proxy_pass http://api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
